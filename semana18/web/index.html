<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socios - Cooperativa UPED</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color: #202938; }
    h1 { color: #0B3D6E; }
    table { border-collapse: collapse; min-width: 340px; }
    th { background: #0B3D6E; color: white; padding: 10px 16px; text-align: left; }
    td { border-bottom: 1px solid #ccd4df; padding: 9px 16px; }
    #estado { color: #555; font-style: italic; }
  </style>
</head>
<body>
  <h1>Socios de la cooperativa</h1>
  <p id="estado">Cargando...</p>
  <table>
    <thead><tr><th>Id</th><th>Nombre</th><th>Saldo</th></tr></thead>
    <tbody id="filas"></tbody>
  </table>

  <script>
    fetch("/socios")
      .then(respuesta => {
        if (!respuesta.ok) throw new Error("Respuesta HTTP " + respuesta.status);
        return respuesta.json();
      })
      .then(socios => {
        const filas = document.getElementById("filas");
        socios.forEach(socio => {
          const fila = document.createElement("tr");
          [socio.id, socio.nombre, "$" + socio.saldo].forEach(valor => {
            const celda = document.createElement("td");
            celda.textContent = valor;
            fila.appendChild(celda);
          });
          filas.appendChild(fila);
        });
        document.getElementById("estado").textContent =
          socios.length + " socios cargados";
      })
      .catch(() => {
        document.getElementById("estado").textContent =
          "No se pudo conectar con el servidor";
      });
  </script>
</body>
</html>
